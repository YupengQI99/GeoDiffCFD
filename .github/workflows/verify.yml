name: Verify GeoDiffCFD
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' -c requirements-reproduce.txt
      - run: python tools/test_release.py
      - run: python tools/update_data_checksums.py --check
